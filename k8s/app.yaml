apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: myfatnesspal-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: myfatnesspal
spec:
  replicas: 1
  strategy:
    type: Recreate          # SQLite + one disk: stop old pod before starting new
  selector:
    matchLabels:
      app: myfatnesspal
  template:
    metadata:
      labels:
        app: myfatnesspal
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001      # makes the PVC writable by user 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: ghcr.io/dycastcoast/myfatnesspal:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: DATA_DIR
              value: /data
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: myfatnesspal-data
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: myfatnesspal
spec:
  selector:
    app: myfatnesspal
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: myfatnesspal
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-dns
spec:
  ingressClassName: traefik
  tls:
    - hosts: [dycast-myfatnesspal.montlab.cc]
      secretName: dycast-myfatnesspal-tls
  rules:
    - host: dycast-myfatnesspal.montlab.cc
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: myfatnesspal
                port:
                  number: 80
