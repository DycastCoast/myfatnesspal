# MyFatnessPal on the Raspberry Pi, reachable only over Tailscale.
# Start:  docker compose up -d      Update:  docker compose pull && docker compose up -d
services:
  myfatnesspal:
    image: ghcr.io/dycastcoast/myfatnesspal:latest   # the same image montlab used (built for arm64)
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    # 127.0.0.1 only: nothing on your Wi-Fi can reach it, just `tailscale serve` on this Pi.
    # That's what makes the Tailscale login header trustworthy.
    ports: ["127.0.0.1:8085:8080"]
    volumes: ["./data:/data"]
    env_file: .env
    environment:
      AUTH_MODE: tailscale
      DATA_DIR: /data
